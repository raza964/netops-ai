name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netops
          POSTGRES_PASSWORD: netops_test_password
          POSTGRES_DB: netops_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netops -d netops_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://netops:netops_test_password@localhost:5432/netops_ai_test?schema=public
      AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      AUTH_URL: http://localhost:3000
      # Provider tests mock fetch; this non-secret placeholder only passes the
      # provider's configuration guard and never reaches the real API.
      VOYAGE_API_KEY: ci-test-key
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm run build:cloudflare
        env:
          NODE_ENV: production

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://netops-ai.it-master-c34.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # OpenNext performs a Next.js build before upload. These non-production
      # values satisfy server environment validation during compilation only;
      # the deployed Worker continues to use its encrypted Cloudflare secrets.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      AUTH_SECRET: deploy-build-only-secret-at-least-32-characters
      AUTH_URL: https://netops-ai.it-master-c34.workers.dev
      NODE_ENV: production

    steps:
      - name: Verify deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - name: Deploy validated Worker
        run: npm run deploy:cloudflare
      - name: Verify production health
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 5 \
            https://netops-ai.it-master-c34.workers.dev/api/health
          curl --fail --show-error --silent --retry 5 --retry-delay 5 \
            https://netops-ai.it-master-c34.workers.dev/api/ready
